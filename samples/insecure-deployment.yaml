# Deliberately insecure: parsing this file does not run security checks.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: insecure-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: insecure-demo
  template:
    metadata:
      labels:
        app: insecure-demo
    spec:
      os:
        name: linux
      containers:
        - name: web
          image: nginx:1.27
          securityContext:
            privileged: true
            allowPrivilegeEscalation: true
